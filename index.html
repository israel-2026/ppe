<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ישראל בסדר העולמי — גלריית סרטונים</title>
  <style>
    :root{
      --bg:#0b1220;
      --bg-soft:#111a2e;
      --card:#16213a;
      --card-hover:#1d2c4d;
      --accent:#3b82f6;
      --accent-2:#60a5fa;
      --text:#eaf0ff;
      --muted:#93a4c4;
      --border:#243352;
      --line:#31456e;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 600px at 80% -10%, #16233f 0%, var(--bg) 55%) fixed;
      color:var(--text);
      font-family:"Segoe UI","Assistant","Rubik",system-ui,-apple-system,Arial,sans-serif;
      line-height:1.65;
      min-height:100vh;
    }
    .wrap{max-width:1180px;margin:0 auto;padding:0 18px 70px}

    /* ---------- Hero / about ---------- */
    header.hero{
      padding:48px 20px 30px;
      text-align:center;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, rgba(59,130,246,.12), transparent);
    }
    header.hero h1{
      margin:0;
      font-size:clamp(30px,5vw,52px);
      letter-spacing:.5px;
      background:linear-gradient(90deg,var(--accent-2),#a5c7ff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    header.hero .sub{font-size:clamp(16px,2.4vw,22px);color:var(--accent-2);margin-top:4px;font-weight:600}
    header.hero .byline{margin-top:6px;color:var(--muted);font-size:15px;letter-spacing:.3px}
    header.hero .lead{max-width:760px;margin:16px auto 0;color:var(--text);font-size:clamp(16px,2vw,19px)}
    .about{
      max-width:820px;margin:26px auto 0;
      background:var(--bg-soft);border:1px solid var(--border);border-radius:16px;
      padding:22px 26px;text-align:right;box-shadow:var(--shadow);
    }
    .about p{margin:0 0 12px;color:#d7e1f7}
    .about p:last-child{margin-bottom:0}
    .about .source{
      margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
      color:var(--muted);font-size:14.5px;
    }

    /* ---------- Lightbox modal ---------- */
    .modal[hidden]{display:none}
    .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal-backdrop{position:absolute;inset:0;background:rgba(4,8,18,.78);backdrop-filter:blur(3px)}
    .modal-box{
      position:relative;z-index:1;width:min(960px,100%);max-height:92vh;overflow:auto;
      background:var(--bg-soft);border:1px solid var(--border);border-radius:18px;
      box-shadow:var(--shadow);
    }
    .modal-box video{width:100%;display:block;background:#000;aspect-ratio:16/9;object-fit:contain;
      border-radius:18px 18px 0 0}
    .modal-meta{padding:18px 22px 22px}
    .modal-meta h2{margin:0 0 8px;font-size:clamp(19px,2.6vw,26px)}
    .modal-meta p{margin:0;color:var(--muted);font-size:16px}
    .modal-close{
      position:absolute;top:10px;left:10px;z-index:2;
      width:38px;height:38px;border-radius:10px;cursor:pointer;
      background:rgba(11,18,32,.7);color:var(--text);border:1px solid var(--border);
      font-size:17px;line-height:1;display:grid;place-items:center;
    }
    .modal-close:hover{background:var(--accent);border-color:var(--accent)}

    .section-title{display:flex;align-items:center;gap:10px;margin:0 0 22px;font-size:20px;color:var(--muted)}
    .section-title::before{content:"";flex:0 0 4px;height:24px;background:var(--accent);border-radius:4px}

    /* ---------- Vertical text outline ---------- */
    .outline{max-width:780px;margin:0 auto}
    .outline ul{list-style:none;margin:0;padding:0}
    /* nested levels: indent + guide line on the right (RTL) */
    .outline .children{margin:2px 13px 6px 0;padding-right:20px;border-right:2px solid var(--line)}
    .row{
      display:flex;align-items:baseline;gap:11px;
      padding:9px 12px;border-radius:10px;transition:background .15s ease;
    }
    .row .mark{flex:0 0 auto;min-width:20px;text-align:center;font-size:13px;color:var(--muted)}
    .row .body{min-width:0;flex:1}
    .row .ttl{font-weight:600;line-height:1.35}
    .row .desc{color:var(--muted);font-size:13.5px;margin-top:2px}
    .row .soon-tag{
      flex:0 0 auto;align-self:center;font-size:11px;font-weight:700;color:var(--muted);
      background:rgba(147,164,196,.14);padding:2px 9px;border-radius:999px;
    }
    /* clickable (ready) rows */
    .row.ready{cursor:pointer}
    .row.ready:hover{background:var(--card)}
    .row.ready .mark{color:var(--accent-2)}
    .row.ready .ttl{color:var(--accent-2)}
    .row.ready:hover .ttl{text-decoration:underline}
    /* level sizing */
    .lvl-intro .ttl{font-size:22px}
    .lvl-intro .mark{font-size:15px}
    .lvl-topic .ttl{font-size:18px}
    .lvl-sub .ttl{font-size:15.5px;font-weight:500}
    .lvl-sub .desc{font-size:13px}
    .row.soon .ttl{color:var(--text);opacity:.85}

    footer{text-align:center;color:var(--muted);font-size:13px;padding:34px 18px 10px;border-top:1px solid var(--border);margin-top:20px}
    .empty{padding:40px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <header class="hero">
    <h1 id="p-title">ישראל בסדר העולמי החדש</h1>
    <div class="sub" id="p-sub"></div>
    <div class="byline" id="p-byline"></div>
    <div class="about" id="about"></div>
  </header>

  <div class="wrap">
    <h2 class="section-title">מפת הסרטונים</h2>
    <div class="outline" id="outline"></div>
    <div class="empty" id="empty" hidden></div>
  </div>

  <footer>
    חינוך פוליטי ציבורי · Public Political Education<br>
    עריכה, הגשה ויצירת תוכן — בהפקת בינה מלאכותית · מבוסס על פרופ' בנימין מילר וחוקרים נוספים
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" data-close aria-label="סגירה">✕</button>
      <div id="modal-player"></div>
      <div class="modal-meta">
        <h2 id="modal-title"></h2>
        <p id="modal-desc"></p>
      </div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);

    function openModal(item){
      const slot = $('#modal-player');
      slot.innerHTML = '<video controls autoplay preload="metadata" playsinline></video>';
      const v = slot.querySelector('video');
      v.src = item.file; v.load();
      $('#modal-title').textContent = item.title || '';
      $('#modal-desc').textContent  = item.description || '';
      $('#modal').hidden = false;
      document.body.style.overflow = 'hidden';
    }
    function closeModal(){
      $('#modal-player').innerHTML = ''; // stops playback
      $('#modal').hidden = true;
      document.body.style.overflow = '';
    }
    document.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closeModal(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#modal').hidden) closeModal(); });

    function rowLi(item, levelClass){
      const ready = !!item.file;
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'row ' + levelClass + (ready ? ' ready' : ' soon');
      row.innerHTML =
        '<span class="mark">' + (ready ? '▶' : '•') + '</span>' +
        '<div class="body"><div class="ttl"></div>' +
        (item.description ? '<div class="desc"></div>' : '') + '</div>' +
        (ready ? '' : '<span class="soon-tag">בקרוב</span>');
      row.querySelector('.ttl').textContent = item.title || '';
      if(item.description) row.querySelector('.desc').textContent = item.description;
      if(ready) row.addEventListener('click', ()=>openModal(item));
      li.appendChild(row);
      return li;
    }

    function render(data){
      const p = data.project || {};
      const setText = (sel,txt)=>{ const el = $(sel); if(el) el.textContent = txt; };
      if(p.title){ document.title = p.title + ' — גלריית סרטונים'; setText('#p-title', p.title); }
      setText('#p-sub',    p.subtitle || '');
      setText('#p-byline', p.byline || '');
      setText('#p-lead',   p.lead || '');
      const about = $('#about');
      about.innerHTML = '';
      (p.about || []).forEach(par=>{ const e=document.createElement('p'); e.textContent=par; about.appendChild(e); });
      if(p.source){ const s=document.createElement('div'); s.className='source'; s.textContent=p.source; about.appendChild(s); }
      if(!(p.about||[]).length && !p.source) about.style.display='none';

      const intro  = data.intro || null;
      const topics = Array.isArray(data.topics) ? data.topics : [];

      // ---- build vertical outline ----
      const outline = $('#outline');
      if(!intro && !topics.length){
        outline.hidden = true;
        $('#empty').hidden = false;
        $('#empty').textContent = 'עדיין אין סרטונים.';
        return;
      }

      const rootUl = document.createElement('ul');
      let introLi = null;
      if(intro){ introLi = rowLi(intro, 'lvl-intro'); rootUl.appendChild(introLi); }

      if(topics.length){
        const topicsUl = document.createElement('ul');
        topicsUl.className = 'children';
        topics.forEach(t=>{
          const tli = rowLi(t, 'lvl-topic');
          const subs = t.sub || [];
          if(subs.length){
            const subUl = document.createElement('ul');
            subUl.className = 'children';
            subs.forEach(s=> subUl.appendChild(rowLi(s, 'lvl-sub')));
            tli.appendChild(subUl);
          }
          topicsUl.appendChild(tli);
        });
        // nest the topics under the intro so the hierarchy reads top-down
        (introLi || rootUl).appendChild(topicsUl);
      }
      outline.appendChild(rootUl);
    }

    fetch('videos.json', {cache:'no-store'})
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(err=>{
        $('#empty').hidden = false;
        $('#empty').innerHTML = 'לא ניתן לטעון את videos.json (' + err.message + ').<br>'+
          'אם פתחתם את הקובץ מקומית בדפדפן זה תקין — יעבוד כשהאתר יעלה ל-GitHub Pages.';
      });
  </script>
</body>
</html>
