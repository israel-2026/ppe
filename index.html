<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ישראל בסדר העולמי — גלריית סרטונים</title>
  <style>
    :root{
      --bg:#0b1220;
      --bg-soft:#111a2e;
      --card:#16213a;
      --card-hover:#1d2c4d;
      --accent:#3b82f6;
      --accent-2:#60a5fa;
      --text:#eaf0ff;
      --muted:#93a4c4;
      --border:#243352;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 600px at 80% -10%, #16233f 0%, var(--bg) 55%) fixed;
      color:var(--text);
      font-family:"Segoe UI","Assistant","Rubik",system-ui,-apple-system,Arial,sans-serif;
      line-height:1.6;
      min-height:100vh;
    }
    header.site{
      padding:34px 20px 22px;
      text-align:center;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, rgba(59,130,246,.10), transparent);
    }
    header.site h1{
      margin:0;
      font-size:clamp(26px,4vw,44px);
      letter-spacing:.5px;
      background:linear-gradient(90deg,var(--accent-2),#a5c7ff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    header.site p{margin:8px auto 0;max-width:680px;color:var(--muted);font-size:16px}
    .wrap{max-width:1180px;margin:0 auto;padding:26px 18px 60px}

    /* Main stage */
    .stage{
      background:var(--bg-soft);
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow);
      margin-bottom:34px;
    }
    .stage video{width:100%;display:block;background:#000;aspect-ratio:16/9;object-fit:contain}
    .stage .meta{padding:20px 22px}
    .stage .meta h2{margin:0 0 8px;font-size:clamp(20px,2.6vw,28px)}
    .stage .meta p{margin:0;color:var(--muted);font-size:16px}

    /* Menu grid */
    .menu-title{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:18px;color:var(--muted)}
    .menu-title::before{content:"";flex:0 0 4px;height:22px;background:var(--accent);border-radius:4px}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
      gap:16px;
    }
    .card{
      text-align:right;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px 16px 14px;
      cursor:pointer;
      transition:transform .15s ease, background .15s ease, border-color .15s ease;
      display:flex;flex-direction:column;gap:8px;min-height:120px;
      color:inherit;font:inherit;
    }
    .card:hover{background:var(--card-hover);transform:translateY(-3px);border-color:var(--accent)}
    .card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.35) inset}
    .card .num{
      width:30px;height:30px;flex:0 0 30px;
      display:grid;place-items:center;
      background:rgba(59,130,246,.16);color:var(--accent-2);
      border-radius:8px;font-weight:700;font-size:14px;
    }
    .card .top{display:flex;align-items:center;gap:10px}
    .card h3{margin:0;font-size:16px;line-height:1.35}
    .card p{margin:0;color:var(--muted);font-size:13.5px;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

    footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 18px 10px}
    .empty{padding:40px;text-align:center;color:var(--muted)}
    a{color:var(--accent-2)}
    @media (max-width:560px){
      .card{min-height:auto}
    }
  </style>
</head>
<body>
  <header class="site">
    <h1 id="p-title">גלריית סרטונים</h1>
    <p id="p-desc"></p>
  </header>

  <div class="wrap">
    <div class="stage" id="stage" hidden>
      <video id="player" controls preload="metadata" playsinline></video>
      <div class="meta">
        <h2 id="cur-title"></h2>
        <p id="cur-desc"></p>
      </div>
    </div>

    <h2 class="menu-title" id="menu-title">כל הסרטונים</h2>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </div>

  <footer>ישראל בסדר העולמי · <span id="count"></span></footer>

  <script>
    const $ = s => document.querySelector(s);

    function pick(video){
      $('#player').src = video.file;
      $('#player').load();
      $('#cur-title').textContent = video.title || '';
      $('#cur-desc').textContent  = video.description || '';
      $('#stage').hidden = false;
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
      const el = document.querySelector('[data-file="'+CSS.escape(video.file)+'"]');
      if(el) el.classList.add('active');
    }

    function render(data){
      const p = data.project || {};
      if(p.title){ document.title = p.title + ' — גלריית סרטונים'; $('#p-title').textContent = p.title; }
      if(p.subtitle) $('#p-title').textContent = (p.title? p.title+' · ':'') + p.subtitle;
      $('#p-desc').textContent = p.description || '';

      const vids = Array.isArray(data.videos) ? data.videos : [];
      $('#count').textContent = vids.length + ' סרטונים';
      const grid = $('#grid');
      grid.innerHTML = '';

      if(!vids.length){
        $('#menu-title').hidden = true;
        $('#empty').hidden = false;
        $('#empty').textContent = 'עדיין אין סרטונים. הוסיפו קובץ MP4 לתיקיית videos/ ורשומה ל-videos.json.';
        return;
      }

      vids.forEach((v,i)=>{
        const card = document.createElement('button');
        card.className = 'card';
        card.dataset.file = v.file;
        card.innerHTML =
          '<div class="top"><span class="num">'+(i+1)+'</span>'+
          '<h3></h3></div><p></p>';
        card.querySelector('h3').textContent = v.title || v.file;
        card.querySelector('p').textContent  = v.description || '';
        card.addEventListener('click', ()=>{ pick(v); $('#stage').scrollIntoView({behavior:'smooth',block:'start'}); });
        grid.appendChild(card);
      });

      pick(vids[0]); // feature the first video
    }

    fetch('videos.json', {cache:'no-store'})
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(err=>{
        $('#menu-title').hidden = true;
        $('#empty').hidden = false;
        $('#empty').innerHTML = 'לא ניתן לטעון את videos.json (' + err.message + ').<br>'+
          'אם פתחתם את הקובץ מקומית בדפדפן, זה תקין — יעבוד כשהאתר יעלה ל-GitHub Pages.';
      });
  </script>
</body>
</html>
