<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ישראל בסדר העולמי — גלריית סרטונים</title>
  <style>
    :root{
      --bg:#0b1220;
      --bg-soft:#111a2e;
      --card:#16213a;
      --card-hover:#1d2c4d;
      --accent:#3b82f6;
      --accent-2:#60a5fa;
      --text:#eaf0ff;
      --muted:#93a4c4;
      --border:#243352;
      --line:#31456e;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 600px at 80% -10%, #16233f 0%, var(--bg) 55%) fixed;
      color:var(--text);
      font-family:"Segoe UI","Assistant","Rubik",system-ui,-apple-system,Arial,sans-serif;
      line-height:1.65;
      min-height:100vh;
    }
    .wrap{max-width:1180px;margin:0 auto;padding:0 18px 70px}

    /* ---------- Hero / about ---------- */
    header.hero{
      padding:48px 20px 30px;
      text-align:center;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, rgba(59,130,246,.12), transparent);
    }
    header.hero h1{
      margin:0;
      font-size:clamp(30px,5vw,52px);
      letter-spacing:.5px;
      background:linear-gradient(90deg,var(--accent-2),#a5c7ff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    header.hero .sub{font-size:clamp(16px,2.4vw,22px);color:var(--accent-2);margin-top:4px;font-weight:600}
    header.hero .lead{max-width:760px;margin:16px auto 0;color:var(--text);font-size:clamp(16px,2vw,19px)}
    .about{
      max-width:820px;margin:26px auto 0;
      background:var(--bg-soft);border:1px solid var(--border);border-radius:16px;
      padding:22px 26px;text-align:right;box-shadow:var(--shadow);
    }
    .about p{margin:0 0 12px;color:#d7e1f7}
    .about p:last-child{margin-bottom:0}
    .about .source{
      margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
      color:var(--muted);font-size:14.5px;
    }

    /* ---------- Main player ---------- */
    .stage{
      background:var(--bg-soft);border:1px solid var(--border);border-radius:18px;
      overflow:hidden;box-shadow:var(--shadow);margin:34px 0 40px;
    }
    .stage video{width:100%;display:block;background:#000;aspect-ratio:16/9;object-fit:contain}
    .stage .placeholder{
      aspect-ratio:16/9;display:grid;place-items:center;
      background:repeating-linear-gradient(45deg,#0d1730,#0d1730 14px,#101d3a 14px,#101d3a 28px);
      color:var(--muted);font-size:18px;text-align:center;padding:20px;
    }
    .stage .meta{padding:20px 22px}
    .stage .meta .kicker{color:var(--accent-2);font-size:13px;font-weight:700;letter-spacing:.4px}
    .stage .meta h2{margin:4px 0 8px;font-size:clamp(20px,2.6vw,28px)}
    .stage .meta p{margin:0;color:var(--muted);font-size:16px}

    .section-title{display:flex;align-items:center;gap:10px;margin:0 0 22px;font-size:20px;color:var(--muted)}
    .section-title::before{content:"";flex:0 0 4px;height:24px;background:var(--accent);border-radius:4px}

    /* ---------- Hierarchical tree ---------- */
    .tree-scroll{overflow-x:auto;padding:6px 2px 12px}
    .tree{min-width:760px}
    .tree ul{
      display:flex;justify-content:center;position:relative;
      padding-top:26px;margin:0;list-style:none;
    }
    .tree li{
      list-style:none;position:relative;
      padding:26px 12px 0;text-align:center;
    }
    /* connectors */
    .tree li::before, .tree li::after{
      content:'';position:absolute;top:0;width:50%;height:26px;
      border-top:2px solid var(--line);
    }
    .tree li::before{right:50%;border-right:2px solid var(--line)}
    .tree li::after{left:50%;border-left:2px solid var(--line)}
    .tree li:only-child::before,.tree li:only-child::after{display:none}
    .tree li:only-child{padding-top:0}
    .tree li:first-child::before,.tree li:last-child::after{border:0}
    .tree li:last-child::before{border-right:2px solid var(--line)}
    .tree li:first-child::after{border-left:2px solid var(--line)}
    .tree ul ul::before{
      content:'';position:absolute;top:0;right:50%;
      border-right:2px solid var(--line);width:0;height:26px;
    }
    .tree > ul{padding-top:0}
    .tree > ul > li{padding-top:0}

    /* nodes (rectangles) */
    .node{
      display:inline-flex;flex-direction:column;gap:6px;justify-content:center;
      width:190px;min-height:88px;padding:14px 14px;
      background:var(--card);border:1.5px solid var(--border);border-radius:14px;
      color:inherit;font:inherit;cursor:pointer;text-align:center;
      transition:transform .15s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
    }
    .node:hover{background:var(--card-hover);transform:translateY(-3px);border-color:var(--accent)}
    .node.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.4) inset}
    .node .badge{
      align-self:center;font-size:11px;font-weight:700;letter-spacing:.4px;
      padding:2px 10px;border-radius:999px;
    }
    .node .badge.ready{background:rgba(59,130,246,.18);color:var(--accent-2)}
    .node .badge.soon{background:rgba(147,164,196,.14);color:var(--muted)}
    .node h3{margin:0;font-size:15px;line-height:1.35}
    .node.intro{width:260px;min-height:96px;border-color:var(--accent);
      background:linear-gradient(180deg,rgba(59,130,246,.18),var(--card))}
    .node.intro h3{font-size:17px}
    .node.topic{width:210px}
    .node.soon{opacity:.72;cursor:default}
    .node.soon:hover{transform:none;background:var(--card);border-color:var(--border)}

    footer{text-align:center;color:var(--muted);font-size:13px;padding:34px 18px 10px;border-top:1px solid var(--border);margin-top:20px}
    .empty{padding:40px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <header class="hero">
    <h1 id="p-title">ישראל בסדר העולמי</h1>
    <div class="sub" id="p-sub"></div>
    <p class="lead" id="p-lead"></p>
    <div class="about" id="about"></div>
  </header>

  <div class="wrap">
    <div class="stage" id="stage">
      <div id="player-slot"></div>
      <div class="meta">
        <div class="kicker" id="cur-kicker">צופים כעת</div>
        <h2 id="cur-title"></h2>
        <p id="cur-desc"></p>
      </div>
    </div>

    <h2 class="section-title">מפת הסרטונים</h2>
    <div class="tree-scroll">
      <div class="tree" id="tree"></div>
    </div>
    <div class="empty" id="empty" hidden></div>
  </div>

  <footer>ישראל בסדר העולמי · מבוסס על עבודתו של פרופ' בני מילר, אוניברסיטת חיפה</footer>

  <script>
    const $ = s => document.querySelector(s);

    function playInStage(item, kicker){
      const slot = $('#player-slot');
      if(item.file){
        slot.innerHTML = '<video controls preload="metadata" playsinline></video>';
        const v = slot.querySelector('video');
        v.src = item.file; v.load();
      }else{
        slot.innerHTML = '<div class="placeholder">הסרטון יתווסף בהמשך 🎬</div>';
      }
      $('#cur-kicker').textContent = kicker || 'צופים כעת';
      $('#cur-title').textContent = item.title || '';
      $('#cur-desc').textContent  = item.description || '';
      document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
      const el = document.querySelector('[data-key="'+item._key+'"]');
      if(el) el.classList.add('active');
    }

    function makeNode(item, cls, kicker){
      const ready = !!item.file;
      const btn = document.createElement('button');
      btn.className = 'node ' + cls + (ready ? '' : ' soon');
      btn.dataset.key = item._key;
      const badge = ready ? '<span class="badge ready">▶ צפייה</span>'
                          : '<span class="badge soon">בקרוב</span>';
      btn.innerHTML = badge + '<h3></h3>';
      btn.querySelector('h3').textContent = item.title || '';
      if(ready){
        btn.addEventListener('click', ()=>{
          playInStage(item, kicker);
          $('#stage').scrollIntoView({behavior:'smooth',block:'start'});
        });
      }
      return btn;
    }

    function render(data){
      const p = data.project || {};
      if(p.title){ document.title = p.title + ' — גלריית סרטונים'; $('#p-title').textContent = p.title; }
      $('#p-sub').textContent  = p.subtitle || '';
      $('#p-lead').textContent = p.lead || '';
      const about = $('#about');
      about.innerHTML = '';
      (p.about || []).forEach(par=>{ const e=document.createElement('p'); e.textContent=par; about.appendChild(e); });
      if(p.source){ const s=document.createElement('div'); s.className='source'; s.textContent=p.source; about.appendChild(s); }
      if(!(p.about||[]).length && !p.source) about.style.display='none';

      const intro  = data.intro || null;
      const topics = Array.isArray(data.topics) ? data.topics : [];

      // assign keys
      if(intro) intro._key = 'intro';
      topics.forEach((t,i)=>{ t._key='t'+i; (t.sub||[]).forEach((s,j)=>{ s._key='t'+i+'s'+j; }); });

      // ---- build tree ----
      const tree = $('#tree');
      if(!intro && !topics.length){
        tree.parentElement.hidden = true;
        $('#empty').hidden = false;
        $('#empty').textContent = 'עדיין אין סרטונים.';
        return;
      }

      const rootUl = document.createElement('ul');
      const rootLi = document.createElement('li');
      if(intro) rootLi.appendChild(makeNode(intro,'intro','פתיח'));

      if(topics.length){
        const topicsUl = document.createElement('ul');
        topics.forEach(t=>{
          const li = document.createElement('li');
          li.appendChild(makeNode(t,'topic','נושא'));
          const subs = t.sub || [];
          if(subs.length){
            const subUl = document.createElement('ul');
            subs.forEach(s=>{
              const sli = document.createElement('li');
              sli.appendChild(makeNode(s,'sub','תת-נושא'));
              subUl.appendChild(sli);
            });
            li.appendChild(subUl);
          }
          topicsUl.appendChild(li);
        });
        rootLi.appendChild(topicsUl);
      }
      rootUl.appendChild(rootLi);
      tree.appendChild(rootUl);

      // feature intro (or first ready item) in the stage
      const first = intro || topics.find(t=>t.file) || topics[0];
      if(first) playInStage(first, intro && first===intro ? 'פתיח' : 'צופים כעת');
    }

    fetch('videos.json', {cache:'no-store'})
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(err=>{
        $('#empty').hidden = false;
        $('#empty').innerHTML = 'לא ניתן לטעון את videos.json (' + err.message + ').<br>'+
          'אם פתחתם את הקובץ מקומית בדפדפן זה תקין — יעבוד כשהאתר יעלה ל-GitHub Pages.';
      });
  </script>
</body>
</html>
